# Serenity: builds the live server whenever Serenity-Server's main moves.
#
# Packages the linux-x64 server and the client, then publishes both to our
# Robust.Cdn (https://serenity-ss14.duckdns.org). The CDN stamps the server
# build with where clients download from and notifies the live server's
# Watchdog, which swaps to it at round end.
# Does nothing on Serenity-Dev.

name: Live Server Build

concurrency:
  group: live-build
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish
    if: github.repository == 'lightningcaesarea/Serenity-Server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch all tags (RobustToolbox)
        run: |
          cd RobustToolbox
          git fetch --all --tags

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet restore
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging -c Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --platform linux-x64

      - name: Package client
        run: dotnet run --project Content.Packaging client --no-wipe-release

      - name: Publish to CDN
        run: |
          ls -la release/
          pip install --quiet requests
          python3 Tools/publish_multi_request.py
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          FORK_ID: serenity
