# Serenity: builds the live server package whenever Serenity-Server's main moves.
#
# The package (hybrid ACZ, linux-x64) is published as a GitHub release tagged
# build-<sha>. The Contabo host's ss14-fetch-build timer downloads it ahead of
# time, so the game server only goes down for the swap, not for a build.
# Does nothing on Serenity-Dev.

name: Live Server Build

concurrency:
  group: live-build
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    if: github.repository == 'lightningcaesarea/Serenity-Server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch all tags (RobustToolbox)
        run: |
          cd RobustToolbox
          git fetch --all --tags

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet restore
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging -c Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --platform linux-x64 --hybrid-acz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA::10}"
          zip="release/SS14.Server_linux-x64.zip"
          sha256sum "$zip" | cut -d' ' -f1 > "$zip.sha256"
          ls -la release/
          gh release create "$tag" "$zip" "$zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Live build ${GITHUB_SHA::10}" \
            --notes "Server package for ${GITHUB_SHA}. Picked up automatically by the live server."

      - name: Prune old builds (keep newest 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q 'map(select(.tagName | startswith("build-"))) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
