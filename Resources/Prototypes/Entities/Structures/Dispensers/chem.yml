- type: entity
  id: ChemDispenserEmpty
  name: chemical dispenser
  suffix: Empty
  parent: ReagentDispenserBasePowerCell # Starlight-edit: power cell chem dispenser
  description: An industrial grade chemical dispenser.
  components:
  - type: SkillRequired # Serenity
    skills: [ Chemistry ]
  - type: Sprite
    sprite: Structures/dispensers.rsi
    # Starlight-start: Chem Dispenser unpowered/wiring panel states
    layers:
      - state: industrial-off
      - state: industrial-working
        visible: false
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      - state: industrial-panel
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
        visible: false
    snapCardinals: false # Starlight-edit: allow non-cardinal rotation for chem dispenser to avoid conflict with 4 direction plumbing connector sprites
    # Starlight-end
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - ChemDispensable
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Machine
    board: ChemDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
  - type: StealTarget
    stealGroup: ChemDispenser
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25, -0.4, 0.25, 0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  # Starlight-start: Generatable Reagents
  - type: ReagentDispenser
    generatableReagents:
      Iron: 2 # ReagentId: x energy for 1 quantity
      Carbon: 2
      Copper: 2
      Hydrogen: 2
      Oxygen: 0 # You really can't pump oxygen or generate it on 2525?
      Sugar: 2
      Silicon: 5
      Phosphorus: 5
      # Serenity: the rest of the elements used to come from finite jugs; they are generated from energy too.
      # A medium power cell holds 720, so a 30u dispense costs 30 x the number here.
      Nitrogen: 2
      Sodium: 3
      Sulfur: 3
      Chlorine: 3
      Ethanol: 3
      Aluminium: 4
      Potassium: 5
      Lithium: 5
      Fluorine: 5
      Iodine: 5
      Mercury: 8 # dangerous and rare
      Radium: 8
  - type: WiresVisuals
  - type: Appearance
  - type: BatteryVisuals
  # Starlight-end

- type: entity
  id: ChemDispenser
  suffix: Filled
  parent: ChemDispenserEmpty
  components:
  - type: ReagentDispenser
  # Serenity: no jugs. Every reagent the dispenser offers is generated from energy (see generatableReagents above),
  # so the Filled version starts with an empty jug storage (it still takes jugs of anything exotic).
  # Starlight-start: Filled powercell slot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        #Starlight Start
        blacklist:
          tags:
          - MechReactor
        #Starlight End
  # Starlight-end
