# Landing spot for medical recovery — a real constructible machine (frame + circuitboard + parts,
# like any other station machine) wearing the fulton beacon's sprite, since recovered bodies
# arrive by fulton balloon. Its fixture is non-hard so nobody bumps into it.
#
# A MedicalRecoveryConsole links to the first pad on its own grid.

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: MedicalRecoveryPad
  name: medical recovery pad
  description: A fulton landing beacon for the medical recovery system. Recovered patients are delivered here.
  components:
  - type: Transform
    anchored: true
  # Overrides BaseMachine's hard fixture: still clickable, never blocks movement.
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.1"
        hard: false
        mask:
        - ItemMask
  - type: ApcPowerReceiver
    powerLoad: 5
  - type: Sprite
    sprite: Objects/Tools/fulton.rsi
    drawdepth: FloorObjects
    noRot: true
    layers:
    - state: extraction_point
    - state: extraction_point_light
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Machine
    board: MedicalRecoveryPadMachineCircuitboard
  - type: MedicalRecoveryPad
  - type: PointLight
    radius: 1.5
    energy: 1.2
    color: "#41e0fc"
