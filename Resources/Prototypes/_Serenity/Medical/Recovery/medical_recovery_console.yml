# Stationary recovery console, built on the medical request computer's look and access. Its UI
# lists every Critical/Dead carrier of a medical recovery implant within range and recovers the
# chosen one to this console's linked pad. See medical_recovery_pad.yml for the pad it links to
# and MedicalRecoverySystem for the scan/recall logic.

- type: entity
  parent: BaseComputerAiAccess
  id: MedicalRecoveryConsole
  name: medical recovery console
  description: Tracks crew carrying a medical recovery implant who are critically wounded or dead, and recalls them to its linked recovery pad.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request-med
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: MedicalRecoveryConsole
  - type: ActivatableUI
    key: enum.MedicalRecoveryConsoleUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.MedicalRecoveryConsoleUiKey.Key:
        type: MedicalRecoveryConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: AccessReader
    access: [["Medical"]]
  - type: Computer
    board: MedicalRecoveryConsoleCircuitboard
  - type: PointLight
    radius: 2.5
    energy: 1.5
    color: "#41e0fc"
  - type: GuideHelp
    guides:
    - MedicalRecovery
