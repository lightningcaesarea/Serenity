# Tuning for the medical system. Edit these values instead of code. Entities pick a config through the
# `config` field on their Wound / Pain component, so a species can define its own (e.g. a pain-resistant one).
# What triggers a wound (damage thresholds, tier names) lives in wound_types.yml; painkiller drugs are in painkillers.yml.

- type: woundConfig
  id: DefaultWounds
  regenTickSeconds: 10
  # Seconds an untreated wound sits at tier 1 / 2 / 3 before dropping a tier (tier 1 then heals fully).
  tierDecaySeconds: [300, 180, 120]
  # Damage types that make a mob bleed, for the bleed source on the health analyzer. Earlier wins.
  bleedSources: [Slash, Piercing]
  # Per wound category: slowTier/slowMultiplier slow movement at that tier or worse; dropTier/dropChance let a
  # hit make the patient drop what they hold. A tier of 0 (or an unlisted category) means never.
  categories:
    Fracture:
      slowTier: 2
      slowMultiplier: 0.7
      dropTier: 3
      dropChance: 0.5
    Burn:
      slowTier: 2
      slowMultiplier: 0.7
    # A raging infection saps the strength
    Infection:
      slowTier: 3
      slowMultiplier: 0.8
  maxStackedWoundsPerType: 3
  # Where a damaging hit lands. A wound goes to one of these (only parts the mob still has), weighted by `weight`;
  # a hit that causes several wounds puts them all in the same place. Wounds of one type in different places are
  # separate wounds (up to maxStackedWoundsPerType); a worse hit in the same place makes that wound worse.
  hitLocations:
  - { type: Head, weight: 8 }
  - { type: Torso, weight: 36 }
  - { type: Arm, symmetry: Left, weight: 10 }
  - { type: Arm, symmetry: Right, weight: 10 }
  - { type: Hand, symmetry: Left, weight: 3 }
  - { type: Hand, symmetry: Right, weight: 3 }
  - { type: Leg, symmetry: Left, weight: 12 }
  - { type: Leg, symmetry: Right, weight: 12 }
  - { type: Foot, symmetry: Left, weight: 3 }
  - { type: Foot, symmetry: Right, weight: 3 }

- type: painConfig
  id: DefaultPain
  maxPain: 100
  tickSeconds: 2
  # Every painkiller after the strongest counts for this fraction of its strength.
  secondaryPainkillerFactor: 0.25
  # Masked pain below this is not reported as "masked" on examine.
  maskedReportThreshold: 5
  # Raw pain per wound tier (tier 1 / 2 / 3).
  woundWeights:
    Fracture: [10, 25, 45]
    Burn: [8, 20, 40]
    Bleeding: [5, 12, 25]
    Laceration: [6, 14, 28]
    Puncture: [7, 16, 30]
    Infection: [3, 8, 15]
  # Felt-pain bands. `threshold` is where the band starts; speedMultiplier and dropChance apply while in it.
  levels:
    Mild:
      threshold: 10
    Moderate:
      threshold: 25
      speedMultiplier: 0.9
    Severe:
      threshold: 50
      speedMultiplier: 0.75
      dropChance: 0.25
    Agonizing:
      threshold: 75
      speedMultiplier: 0.6
      dropChance: 0.5
