# Antibiox is a broad-spectrum antibiotic: it needs no diagnosis and protects against infection, but it does not
# cure one. While it is active it blocks new infections, freezes an existing infection at its current tier and
# suppresses its symptoms. The infection resumes when the drug wears off; draining it in surgery cures it.
# The price is gut dysbiosis: it saps max stamina while it works and for a while after. At 16u or more it overdoses:
# it poisons the patient, stops protecting them, and makes infections escalate faster.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectAntibiotic
  name: antibiotic
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Wound

# Applied while overdosed on an antibiotic: cancels the antibiotic's protection and speeds up infections.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectAntibioticOverdose
  name: antibiotic overdose
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Wound

# Stand-in for the gut flora a broad-spectrum drug wipes out. (There is no passive-healing-from-food mechanic
# to switch off, so it lowers max stamina instead.)
- type: entity
  parent: StaminaModifierStatusEffect
  id: StatusEffectDysbiosis
  name: gut dysbiosis
  components:
  - type: StaminaModifierStatusEffect
    modifier: 0.85

- type: reagent
  id: Antibiox
  name: reagent-name-antibiox
  group: Medicine
  desc: reagent-desc-antibiox
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#c9e6a3"
  metabolisms:
    Bloodstream:
      # Slow to metabolize, so a single 15u dose (an auto-injector) protects for about 7 minutes: it stays in the
      # blood for 15 / 0.05 = 300 s and the antibiotic effect lingers 120 s after the last of it is gone.
      # Metabolizing runs once a second and the effects don't weaken with a lower rate.
      metabolismRate: 0.05
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectAntibiotic
        time: 120
        type: Update
      # Broad-spectrum drugs wipe out helpful bacteria too; it lingers a while after the drug is gone
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDysbiosis
        time: 240
        type: Update
      # Overdose (16u): poisons the patient, and the drug stops protecting against infection and instead speeds it up
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Antibiox
          min: 16
        damage:
          types:
            Poison: 1.5
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Antibiox
          min: 16
        effectProto: StatusEffectAntibioticOverdose
        time: 10
        type: Update

- type: reaction
  id: Antibiox
  reactants:
    Dylovene:
      amount: 1
    Sulfur:
      amount: 1
    Ethanol:
      amount: 1
  products:
    Antibiox: 2
