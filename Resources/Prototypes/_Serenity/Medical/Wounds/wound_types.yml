# Ported from HellWatcher/honksquad-ss14 (MIT-licensed fork of space-wizards/space-station-14),
# https://github.com/HellWatcher/honksquad-ss14 — RussStation namespace, adapted for Serenity.
# Laceration and Puncture wound types are Serenity additions.
#
# A wound type is triggered by the damage types listed in `damage`, each with a weight. A hit's score is
# the sum of weight x damage dealt over those types, so one wound type can respond to several damage types and
# several types in one hit add up. `thresholds` are the hit scores for tier 1, 2 and 3.
# Tier names live in the locale files (wound-<id lowercase>-<tier>).

- type: woundType
  id: BluntFracture
  category: Fracture
  damage: { Blunt: 1 }
  thresholds: [15, 25, 40]

- type: woundType
  id: HeatBurn
  category: Burn
  damage: { Heat: 1 }
  thresholds: [10, 20, 35]

- type: woundType
  id: ColdBurn
  category: Burn
  damage: { Cold: 1 }
  thresholds: [10, 20, 35]

- type: woundType
  id: ShockBurn
  category: Burn
  damage: { Shock: 1 }
  thresholds: [10, 20, 35]

- type: woundType
  id: CausticBurn
  category: Burn
  damage: { Caustic: 1 }
  thresholds: [10, 20, 35]

- type: woundType
  id: RadiationBurn
  category: Burn
  damage: { Radiation: 1 }
  thresholds: [10, 20, 35]

- type: woundType
  id: SlashLaceration
  category: Laceration
  damage: { Slash: 1 }
  thresholds: [12, 22, 35]

- type: woundType
  id: PiercingPuncture
  category: Puncture
  damage: { Piercing: 1 }
  thresholds: [10, 18, 30]
