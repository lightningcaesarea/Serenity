# Packaging for the ChemMaster's Packaging tab. Sizes come from each prototype's own solution,
# so pills/patches/bottles here are just the selectable looks.

# The packaging buffer is a separate solution from the ChemMaster's main (plumbing) buffer.
- type: entity
  parent: Solution
  id: SolutionChemMasterPackagingBuffer
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: packagingBuffer
    solution:
      maxVol: 1000
      canReact: false

