- type: body
  id: Chitinid
  name: "chitinid"
  root: torso
  slots:
    head:
      part: HeadChitinid
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        tongue: OrganHumanTongue
        eye_implant: null
        nose_implant: null
        brain_implant: null
    torso:
      part: TorsoChitinid
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        heart: OrganAnimalHeart
        lungs: OrganHumanLungs
        stomach: OrganAnimalStomach
        liver: OrganAnimalLiver
        kidneys: OrganHumanKidneys
        cavity: null
    right arm:
      part: RightArmChitinid
      connections:
      - right hand
    left arm:
      part: LeftArmChitinid
      connections:
      - left hand
    right hand:
      part: RightHandChitinid
      organs:
        hand_implant: null
    left hand:
      part: LeftHandChitinid
      organs:
        hand_implant: null
    right leg:
      part: RightLegChitinid
      connections:
      - right foot
    left leg:
      part: LeftLegChitinid
      connections:
      - left foot
    right foot:
      part: RightFootChitinid
    left foot:
      part: LeftFootChitinid

# Body parts reuse the moth part behaviour (juice yields, part types) with chitinid sprites.

- type: entity
  id: TorsoChitinid
  name: "chitinid torso"
  parent: TorsoMoth
  components:
  - type: Sprite
    sprite: _Serenity/Mobs/Species/Chitinid/parts.rsi
    state: torso_m

- type: entity
  id: HeadChitinid
  name: "chitinid head"
  parent: HeadMoth
  components:
