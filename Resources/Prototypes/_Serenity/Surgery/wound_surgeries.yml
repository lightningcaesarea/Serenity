    - SurgeryStepSutureLaceration
  - type: SurgeryWoundCondition
    category: Laceration
  - type: SurgeryPartCondition
    parts:
    - Torso
  - type: SurgerySpeciesCondition
    speciesBlacklist:
    - SlimePerson
    - NeoSlimePerson
    - IPC
