# Bounty contracts PDA program. Ported from Frontier Station 14 (MIT, 5be37d18c2).
- type: entity
  parent: BasePDACartridge
  id: BountyContractsCartridge
  name: bounty contracts cartridge
  description: A program for browsing and posting bounty contracts.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-s
  - type: Icon
    sprite: Objects/Devices/cartridge.rsi
    state: cart-s
  - type: UIFragment
    ui: !type:BountyContractUi
  - type: Cartridge
    programName: bounty-contracts-program-name
    icon: Interface/Actions/shop.png
  - type: BountyContractsCartridge
  # Removing someone else's contract needs one of these; posting is open to everyone.
  - type: AccessReader
    access: [ [ Security ], [ Command ] ]
