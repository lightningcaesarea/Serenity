# Skill books teach one skill when read (use in hand) and are used up.
# Book restrictions (departments/jobs) keep advanced skills within their department.

- type: entity
  abstract: true
  parent: BaseItem
  id: SkillBookBase
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_strong
      map: [ "cover" ]
    - state: decor_wingette
      color: "#e5e7eb"
    - state: icon_text
      map: [ "icon" ]
  - type: Item
    size: Small
  - type: Tag
    tags:
    - Book

- type: entity
  parent: SkillBookBase
  id: SkillBookEngineering
  name: Basic Engineering Manual
  description: A dense training manual. Reading it cover to cover teaches its subject, but it won't survive being studied that hard.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_strong
      color: "#b45309"
      map: [ "cover" ]
    - state: decor_wingette
      color: "#e5e7eb"
    - state: icon_wrench
      map: [ "icon" ]
  - type: SkillBook
    skill: Engineering

