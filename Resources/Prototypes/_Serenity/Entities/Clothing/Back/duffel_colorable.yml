# ── Randomized variant ────────────────────────────────────────────────────────
# RandomSprite picks one whole entry from `available` at spawn time (GetAllGroups
# defaults to false), so each entry below is a coordinated body/trim color combo
# rather than independently-rolled layers — gives a random-but-tasteful look
# rather than mismatched colors on every part.

- type: entity
  parent: ClothingBackpackDuffelColorable
  id: ClothingBackpackDuffelColorRandom
  name: patchwork duffel bag
  description: A large duffel bag in a random color scheme, no two quite alike.
  components:
  - type: RandomSprite
    available:
    - duffelBase: { icon-base: "#a83232" }
      duffelSling: { icon-sling: "#3a3a3a" }
      duffelStraps: { icon-decal-straps: "#3a3a3a" }
      duffelHandle: { icon-handle: "#3a3a3a" }
    - duffelBase: { icon-base: "#2f4f8f" }
      duffelSling: { icon-sling: "#1c1c1c" }
      duffelStraps: { icon-decal-straps: "#1c1c1c" }
      duffelHandle: { icon-handle: "#1c1c1c" }
    - duffelBase: { icon-base: "#3f5c34" }
      duffelSling: { icon-sling: "#26311f" }
      duffelStraps: { icon-decal-straps: "#26311f" }
      duffelHandle: { icon-handle: "#26311f" }
    - duffelBase: { icon-base: "#e8b23c" }
      duffelSling: { icon-sling: "#5c4322" }
      duffelStraps: { icon-decal-straps: "#5c4322" }
      duffelHandle: { icon-handle: "#5c4322" }
    - duffelBase: { icon-base: "#6b3fa0" }
      duffelSling: { icon-sling: "#2f1a45" }
      duffelStraps: { icon-decal-straps: "#2f1a45" }
      duffelHandle: { icon-handle: "#2f1a45" }
    - duffelBase: { icon-base: "#1e1e1e" }
      duffelSling: { icon-sling: "#4a4a4a" }
      duffelStraps: { icon-decal-straps: "#4a4a4a" }
      duffelHandle: { icon-handle: "#4a4a4a" }
    - duffelBase: { icon-base: "#e8e8e8" }
      duffelSling: { icon-sling: "#9c9c9c" }
      duffelStraps: { icon-decal-straps: "#9c9c9c" }
      duffelHandle: { icon-handle: "#9c9c9c" }
  - type: Sprite
    layers:
    - state: icon-base
      map: ["duffelBase"]
    - state: icon-sling
      map: ["duffelSling"]
    - state: icon-decal-straps
      map: ["duffelStraps"]
    - state: icon-handle
      map: ["duffelHandle"]
    - state: icon-zipper
      map: ["duffelZipper"]
