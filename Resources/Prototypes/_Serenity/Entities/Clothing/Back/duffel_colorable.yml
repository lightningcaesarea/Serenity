# Colorable duffel system — recreates the layered-sprite-tinting mechanic Frontier
# Station 14 uses for its departmental duffels, built fresh for Serenity (their
# current entity/YAML wiring is AGPL post-2024-07-01 and not portable; this is an
# original re-implementation of the mechanic, not a copy of their code).
#
# The shared texture (color.rsi) is CC-BY-SA-3.0, originally from tgstation, via
# Frontier Station 14 — see its meta.json for full provenance. Five independently
# tintable regions: base, sling, straps, handle, zipper. Each colored variant below
# just overrides the `color:` on each layer/state — no new art needed per color.

- type: entity
  parent: ClothingBackpackDuffel
  id: ClothingBackpackDuffelColorable
  abstract: true
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Back/Duffels/color.rsi
    layers:
    - state: icon-base
      map: ["duffelBase"]
    - state: icon-sling
      map: ["duffelSling"]
    - state: icon-decal-straps
      map: ["duffelStraps"]
    - state: icon-handle
      map: ["duffelHandle"]
    - state: icon-zipper
      map: ["duffelZipper"]
  - type: Clothing
    sprite: _Serenity/Clothing/Back/Duffels/color.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-base
        map: ["duffelBase"]
      - state: equipped-BACKPACK-sling
        map: ["duffelSling"]
      - state: equipped-BACKPACK-decal-straps
        map: ["duffelStraps"]
      - state: equipped-BACKPACK-handle
        map: ["duffelHandle"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
        map: ["duffelBase"]
      - state: inhand-left-sling
        map: ["duffelSling"]
      - state: inhand-left-decal-straps
        map: ["duffelStraps"]
      - state: inhand-left-handle
        map: ["duffelHandle"]
      - state: inhand-left-zipper
        map: ["duffelZipper"]
      right:
      - state: inhand-right-base
        map: ["duffelBase"]
      - state: inhand-right-sling
        map: ["duffelSling"]
      - state: inhand-right-decal-straps
        map: ["duffelStraps"]
      - state: inhand-right-handle
        map: ["duffelHandle"]
      - state: inhand-right-zipper
        map: ["duffelZipper"]

# ── Fixed color variants ──────────────────────────────────────────────────────
# Each overrides the color of every layer via LayerData shorthand. "Base" is the
# main body color, the rest (sling/straps/handle) form the accent/trim color.

