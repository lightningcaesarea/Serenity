    - CrateArmoryLaser
    - CrateFunPlushie
    - LandMineExplosive
    - BannerSyndicate
    rarePrototypes:
    - CrateSyndicateSurplusBundle
    - CrateCargoLuxuryHardsuit
    rareChance: 0.05
