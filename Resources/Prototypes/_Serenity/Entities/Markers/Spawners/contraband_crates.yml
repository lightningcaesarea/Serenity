# Cargo of a smuggler dead-drop pod (see /Maps/_Serenity/Shuttles/deaddrop.yml).
- type: entity
  id: SerenityContrabandCrateSpawner
  name: contraband crate spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Storage/Crates/generic.rsi
      state: icon
  - type: RandomSpawner
