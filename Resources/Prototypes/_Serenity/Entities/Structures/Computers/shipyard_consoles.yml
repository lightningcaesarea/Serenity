# Specialised shipyard consoles — one per vessel category.
# All inherit from ComputerShipyard (Starlight) for plumbing; only sprite, groups, and light differ.
# Screen states borrow from the cargo request console RSI to match the station's visual language.
# Salvage/Cargo:  request      | gold   #b89f25
# Service:        request-srv  | green  #afe837
# Medical:        request-med  | cyan   #41e0fc
# Science:        request-sci  | purple #b53ca1
# Security:       request-sec  | red    #d11d00
# Command:        shipyard     | yellow #c9c042 (Starlight RSI)

- type: entity
  id: ComputerShipyardSalvage
  parent: ComputerShipyard
  name: salvage & cargo shipyard
  description: Used to purchase salvage, mining, and cargo vessels.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: ShipyardConsole
    groups: [ ShipyardSalvage ]
    targetIdSlot:
      name: id-card-console-target-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: true
      whitelist:
        components:
        - IdCard
    billSlot:
      name: shipyard-console-bills-slot
      ejectOnBreak: true
      whitelist:
        components:
        - Cash
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"

