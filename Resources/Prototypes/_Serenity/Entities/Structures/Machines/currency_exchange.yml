- type: entity
  parent: BaseComputerAiAccess
  id: CurrencyExchangeMachine
  name: currency exchange
  description: Converts Federal Bills into Sector Credits and back. Takes a cut.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: CurrencyExchange
    spesosPerCredit: 100
    fee: 0.1
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _Starlight/Structures/Machines/atm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: offline
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 1.6
    color: "#57A3F7"
  - type: Rotatable
    rotateWhileAnchored: false
