# Typing bubbles. Sprites come from Delta-V's speech.rsi (CC-BY-SA-3.0), see the RSI's meta.json for credits.

- type: typingIndicator
  id: felinid
  spritePath: /Textures/_Serenity/Effects/speech.rsi
  typingState: felinid0
  idleState: felinid0
  offset: 0, 0.2

# Shown in place of the species bubble while typing in the matching channel.
- type: typingIndicator
  id: whisper
  spritePath: /Textures/_Serenity/Effects/speech.rsi
  typingState: whisper0
  idleState: whisper1
  offset: -0.05, 0.1

- type: typingIndicator
  id: emote
  spritePath: /Textures/_Serenity/Effects/speech.rsi
  typingState: emote0
  idleState: emote1
  offset: -0.05, 0.1

- type: typingIndicator
  id: ooc
  spritePath: /Textures/_Serenity/Effects/speech.rsi
  typingState: ooc0
  idleState: ooc1
  offset: -0.05, 0.1

- type: typingIndicator
  id: radio
  spritePath: /Textures/_Serenity/Effects/speech.rsi
  typingState: radio0
  idleState: radio1
  offset: -0.05, 0.1

# Which bubble goes with which chat channel. Add an entry (and a typingIndicator above) to give another channel one.
- type: typingChannelIndicator
  id: WhisperTyping
  channel: Whisper
  indicator: whisper

- type: typingChannelIndicator
  id: EmoteTyping
  channel: Emotes
  indicator: emote

- type: typingChannelIndicator
  id: OocTyping
  channel: OOC
  indicator: ooc

- type: typingChannelIndicator
  id: LoocTyping
  channel: LOOC
  indicator: ooc

- type: typingChannelIndicator
  id: RadioTyping
  channel: Radio
  indicator: radio
