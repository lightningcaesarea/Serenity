# Assistants Time
- type: loadoutEffectGroup
  id: HonoredAssistant
  # Serenity: time requirement removed, these are unlocked from the start.
  # Restore by re-adding a JobRequirementLoadoutEffect with a RoleTimeRequirement on JobPassenger.
  effects: []

# Head of Assistants (for grey mantle)
- type: loadoutEffectGroup
  id: MasterGrey
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobPassenger
      time: 20h # fun mantle for the most experienced assistants

